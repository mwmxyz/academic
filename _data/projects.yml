# Undead Computer - ELO Exhibit
- project: "Undead Computer (undead.computer) - ELO Exhibit"
  role: Designer
  duration: July-August 2024
  # url: "https://undead.computer"
  description: "Electronic Literature Organization exhibit titled Undead Computer, a game-like meta-exhibit focused on the exploration and interactive engagement with obsolete technologies. This exhibit invites participants to interact with, modify, and repurpose the text of the website itself, while dead links and other phenomena speak to the decay of the once hopeful techno-space."

